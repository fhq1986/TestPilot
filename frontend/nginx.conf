server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端是 history 模式路由：/recorder 这类路径在磁盘上没有对应文件，
    # 必须回退到 index.html，否则刷新页面会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源带内容哈希，可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API：转发到 compose 里的服务名。
    # 客户端地址里带 client_max_body_size —— 用例导入 Excel / Swagger 文件可能不小
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64m;

        # 执行/报告接口可能耗时较久，别让 nginx 提前掐断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SignalR 需要长连接与 Upgrade 头，单独放宽超时
    location /hubs/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # 截图等静态产物（trace 已改为受权 API 端点，走上面的 /api/ 转发）
    location /screenshots/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # 前端不需要暴露后端健康检查之外的运维信息
    location = /health {
        proxy_pass http://backend:8080/health;
    }
}
