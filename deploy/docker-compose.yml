# 一键起全栈（迭代 D：容器化交付）
#
#   cp .env.example .env    # 填写 JWT_KEY / WEBHOOK_TOKEN 等
#   docker compose up -d --build
#
# 后端以 Production 模式运行，会校验 Jwt__Key / ConnectionStrings__Default /
# Webhook__Token / AllowedOrigins 四项，缺任何一项都会启动失败——
# 这是刻意设计的，避免把开发默认值带上线。
#
# 链路：浏览器 → nginx(前端) → backend(API) → postgres
#                                        └→ aiworker(LLM 调用)
#
# 对外端口（均可通过 .env 覆盖）：
#   frontend  8088 → 80     浏览器入口
#   backend   8002 → 8080   直连 API（CI webhook、接口调试）
#   aiworker  8001 → 8000   LLM 服务
#   postgres  5432 → 5432   仅绑回环
# 容器之间走 compose 网络，用的是容器内端口（backend:8080 / aiworker:8000），
# 因此改宿主机映射不影响服务间调用。

services:
  postgres:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_test}
    volumes:
      # pg18 镜像的新数据布局：挂父目录 /var/lib/postgresql，数据落在其子目录
      # （挂 /var/lib/postgresql/data 会触发镜像的 mount-point 边界断言而拒绝启动）
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_test}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # 默认只映射到宿主机的回环地址：数据库不该直接开在公网
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  aiworker:
    build:
      context: ./backend/src/AIWorker
    restart: unless-stopped
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      # 凭据只从环境注入，绝不写进镜像
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      # 服务间鉴权（必填）：backend 侧 AIWorker__Token 必须与这里一致，否则 /api/* 全部 401
      WORKER_TOKEN: ${WORKER_TOKEN:?必须在 .env 中配置 WORKER_TOKEN（与后端共享的服务间令牌）}
    # 发布到宿主机 8001（容器内仍是 8000）。
    # 这里用 ports 而不是 expose：expose 只在容器网络内可见，宿主机访问不到。
    # 只绑回环：Worker 无用户级鉴权且能驱动 LLM 花销，不该暴露给内网其它主机；
    # 服务间调用走 compose 网络（backend 容器 → aiworker:8000），不经这个映射。
    ports:
      - "127.0.0.1:${AIWORKER_PORT:-8001}:8000"

  # SignalR 跨实例 backplane（多实例就绪）：backend 多副本（--scale backend=N）时，
  # 执行进度等 Hub 事件经 Redis 广播才能送达任意副本上的浏览器连接。
  # 数据全在内存，不需要持久化卷；仅 compose 网络内可达，不发布宿主机端口。
  redis:
    image: docker.1ms.run/library/redis:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # 对象存储（多实例就绪收尾）：执行截图/trace/富文本图片统一存 MinIO。
  # 多副本（--scale backend=N）时本地卷各副本互不相通，产物必须走共享存储。
  # ⚠ 切换后历史产物不自动迁移：旧执行记录里的截图/trace 链接会失效（如需保留先手工迁移）。
  # bitnami 版：不要写 command: server /data（会绕过 bitnami entrypoint 导致
  # 环境变量失效与 /data 权限拒绝——file access denied 踩过）；数据目录固定
  # /bitnami/minio/data，console 默认 9001。
  minio:
    image: bitnami/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    # 只发布控制台（9001）到宿主机回环，供人工查看存储内容；
    # S3 API（9000）仅 compose 网络内可达，backend 走内网直连。
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      aiworker:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # __ 是 .NET 配置的分层分隔符：Jwt__Key → Jwt:Key
      Jwt__Key: ${JWT_KEY:?必须在 .env 中配置 JWT_KEY（至少 32 字符）}
      Jwt__Issuer: ${JWT_ISSUER:-ai-test-platform}
      Jwt__Audience: ${JWT_AUDIENCE:-ai-test-platform}
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-ai_test};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      Webhook__Token: ${WEBHOOK_TOKEN:?必须在 .env 中配置 WEBHOOK_TOKEN}
      AllowedOrigins: ${ALLOWED_ORIGINS:-http://localhost:8088}
      AIWorker__BaseUrl: http://aiworker:8000
      # 服务间鉴权：与 aiworker 的 WORKER_TOKEN 同源（.env），两边不一致时后端调 Worker 全部 401
      AIWorker__Token: ${WORKER_TOKEN:?必须在 .env 中配置 WORKER_TOKEN（与后端共享的服务间令牌）}
      # 容器内没有桌面环境，录制器必须关闭（详见 backend/Dockerfile 注释）
      Recorder__Enabled: "false"
      # SignalR backplane：默认走上面的 redis；置空（SIGNALR_REDIS=""）退回进程内广播
      SignalR__Redis: ${SIGNALR_REDIS:-redis:6379}
      # 产物存储：默认 MinIO（多副本共享）；置 STORAGE_PROVIDER=local 可退回下面的本地卷。
      # 启动时若 bucket 不存在会自动创建（Program.cs EnsureBucketAsync）
      Storage__Provider: ${STORAGE_PROVIDER:-minio}
      Storage__Minio__Endpoint: minio:9000
      Storage__Minio__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      Storage__Minio__SecretKey: ${MINIO_ROOT_PASSWORD:-minioadmin}
      Storage__Minio__Bucket: ${MINIO_BUCKET:-aitest-artifacts}
      Storage__Minio__Secure: "false"
    volumes:
      # 执行产物持久化：仅在 STORAGE_PROVIDER=local 时使用（录制输出目录始终本地）
      - screenshots:/app/screenshots
      - traces:/app/traces
      - recordings:/app/recordings
    # 发布到宿主机 8002（容器内仍是 8080）。
    # 直连后端而不是走 nginx：CI 的 webhook 调用与接口调试需要绕开前端代理。
    # ⚠ 多副本扩展（--scale backend=N）时此固定映射会端口冲突：需移除 ports
    #   （前端 nginx 走 compose 网络 DNS 轮询各副本），webhook 改经负载均衡进。
    ports:
      - "${BACKEND_API_PORT:-8002}:8080"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8088}:80"

volumes:
  pgdata:
  miniodata:
  screenshots:
  traces:
  recordings:
