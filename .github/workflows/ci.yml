name: CI 门禁

# 迭代 F：把已有的门禁真正接上。
# 此前 scripts/coverage.sh（单测 + 覆盖率棘轮）与前端 type-check/vitest 都只是本地脚本，
# 没有任何地方强制跑 —— 门禁形同虚设。这里补上。
#
# 刻意**暂不跑集成测试**：它需要 Postgres，且要真实跑通还得装 Playwright 浏览器
# （有 8 个浏览器用例）。存量失败已清零（2026-09-23 本地 80/80，见
# docs/integration-test-hang-diagnosis.md），要接进来就复用 contract-drift.yml 的
# pgvector service + TEST_PG_CONNECTION（绕开 Testcontainers），并补 playwright 安装步骤。
# 注意测试库必须「出生即带 vector 扩展」：TestApiFactory 用 TEMPLATE 建库来保证，
# 直接给一个空库会让驱动类型目录定格、向量列读写全废（详见该文件注释）。
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 先整解编译：coverage.sh 只构建 UnitTests 及其依赖，
      # 这一步能把 IntegrationTests 等其它工程的编译错误也挡住
      - name: 编译整个解决方案
        run: dotnet build backend/AI.TestPlatform.sln -c Release --nologo

      # 单测 + 覆盖率棘轮门禁（Api=10 / Application=68，只可上调）
      - name: 单元测试 + 覆盖率门禁
        run: bash scripts/coverage.sh

      - name: 覆盖率日志（失败时定位用）
        if: failure()
        run: tail -n 80 .run/logs/coverage.log || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 刻意用 20：test-setup.ts 里记着 Node ≥25 的 webstorage 会与 jsdom 冲突
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 类型检查
        working-directory: frontend
        run: npm run type-check

      - name: 单元测试
        working-directory: frontend
        run: npm run test
